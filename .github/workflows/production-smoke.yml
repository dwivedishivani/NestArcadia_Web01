name: Production Browser Smoke

on:
  workflow_run:
    workflows: ["Deploy NestArcadia to Hostinger"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium for live mobile smoke
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright-smoke" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/playwright-smoke/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test deployed mobile hero and lead conversion event flow
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/playwright-smoke/node_modules/playwright/index.mjs
          SMOKE_BASE_URL: https://nestarcadia.com
        run: node scripts/production-smoke.mjs
