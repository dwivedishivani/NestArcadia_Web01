# Deploys the validated Vite production build to Hostinger via SSH.
# Repository secrets required: HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT,
# HOSTINGER_SSH_USERNAME, HOSTINGER_SSH_PASSWORD.
name: Deploy NestArcadia to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestarcadia-hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare optimized homepage hero image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp imagemagick
          mkdir -p public/images
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            'https://etmrhxapfvyaispuvnft.supabase.co/storage/v1/object/public/site-images/home/home-hero-carousel-hero-hero-carousel-photo-1-20261006220649229.webp' \
            --output "$RUNNER_TEMP/home-hero-source.webp"
          cwebp -quiet -mt -resize 1600 0 -q 78 \
            "$RUNNER_TEMP/home-hero-source.webp" \
            -o public/images/home-hero-optimized-v2.webp
          cwebp -quiet -mt -resize 1100 0 -q 72 \
            "$RUNNER_TEMP/home-hero-source.webp" \
            -o public/images/home-hero-mobile-v2.webp
          test -s public/images/home-hero-optimized-v2.webp
          test -s public/images/home-hero-mobile-v2.webp
          echo "Optimized desktop hero: $(du -h public/images/home-hero-optimized-v2.webp | cut -f1)"
          echo "Optimized mobile hero: $(du -h public/images/home-hero-mobile-v2.webp | cut -f1)"
      - name: Prepare responsive site image variants
        run: node scripts/prepare-responsive-site-images.mjs

      - name: Prepare NestArcadia app icons
        run: node scripts/prepare-app-icons.mjs

      - name: Prepare self-hosted Latin fonts
        run: node scripts/prepare-local-fonts.mjs

      - name: Build production site
        run: pnpm build

      - name: Validate production output
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/images/home-hero-mobile-v2.webp
          test -s dist/images/home-hero-optimized-v2.webp
          test -s dist/apple-touch-icon.png
          test -s dist/favicon.ico
          test -s dist/android-chrome-192x192.png
          test -s dist/android-chrome-512x512.png
          test -s dist/site.webmanifest
          test -s dist/fonts/fonts-v1.css
          test -s dist/fonts/dm-sans-latin-v1.woff2
          test -s dist/fonts/playfair-display-latin-v1.woff2
          test -s dist/fonts/playfair-display-italic-latin-v1.woff2
          echo "Production build, hero images, and self-hosted fonts validated."

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestarcadia-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy site files over SSH
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$HOSTINGER_SSH_HOST" || -z "$HOSTINGER_SSH_PORT" || -z "$HOSTINGER_SSH_USERNAME" || -z "$HOSTINGER_SSH_PASSWORD" ]]; then
            echo "::error::Missing one or more Hostinger SSH repository secrets. Expected HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT, HOSTINGER_SSH_USERNAME, HOSTINGER_SSH_PASSWORD."
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" "$HOSTINGER_SSH_HOST" >> ~/.ssh/known_hosts

          # Upload the complete built site in one transfer without deleting old
          # files. Existing Hostinger dot-directories remain untouched.
          tar -C dist --exclude='.well-known' -czf - . |
            SSHPASS="$HOSTINGER_SSH_PASSWORD" sshpass -e ssh \
              -p "$HOSTINGER_SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$HOSTINGER_SSH_USERNAME@$HOSTINGER_SSH_HOST" \
              'set -eu; target="$HOME/domains/nestarcadia.com/public_html"; mkdir -p "$target"; tar -xzf - -C "$target"; test -s "$target/index.html"; test -s "$target/images/home-hero-mobile-v2.webp"; test -s "$target/images/home-hero-optimized-v2.webp"; test -s "$target/apple-touch-icon.png"; test -s "$target/favicon.ico"; test -s "$target/android-chrome-192x192.png"; test -s "$target/android-chrome-512x512.png"; test -s "$target/site.webmanifest"; test -s "$target/fonts/fonts-v1.css"; test -s "$target/fonts/dm-sans-latin-v1.woff2"; test -s "$target/fonts/playfair-display-latin-v1.woff2"; test -s "$target/fonts/playfair-display-italic-latin-v1.woff2"; echo "Remote production files, hero images, and fonts verified."'

          echo "Production files uploaded to Hostinger."

          # The public HTML is identical for visitors and contains no private data.
          # Require revalidation without a blanket no-store policy on the SPA shell.
          html_cache_control=$(curl --location --silent --show-error --retry 3 --retry-delay 2 -I "https://nestarcadia.com/" | awk -F': ' 'tolower($1) == "cache-control" { value=tolower($2) } END { gsub("\\r", "", value); print value }')
          echo "Homepage Cache-Control: $html_cache_control"
          case "$html_cache_control" in
            *no-store*) echo "::error::Public homepage still sends Cache-Control: no-store."; exit 1 ;;
            *no-cache*) ;;
            *) echo "::error::Homepage must use Cache-Control: no-cache for safe revalidation."; exit 1 ;;
          esac

          for url in "https://nestarcadia.com/" "https://nestarcadia.com/images/home-hero-mobile-v2.webp" "https://nestarcadia.com/images/home-hero-optimized-v2.webp" "https://nestarcadia.com/apple-touch-icon.png" "https://nestarcadia.com/favicon.ico" "https://nestarcadia.com/android-chrome-192x192.png" "https://nestarcadia.com/android-chrome-512x512.png" "https://nestarcadia.com/site.webmanifest" "https://nestarcadia.com/fonts/fonts-v1.css" "https://nestarcadia.com/fonts/dm-sans-latin-v1.woff2" "https://nestarcadia.com/fonts/playfair-display-latin-v1.woff2" "https://nestarcadia.com/fonts/playfair-display-italic-latin-v1.woff2"; do
            status=$(curl --location --silent --show-error --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> HTTP $status"
            test "$status" = "200"
          done

          # A 200 response may still be the SPA fallback HTML rather than an image.
          # Verify the two critical hero assets have a real WebP response MIME type
          # before marking a deployment successful.
          for url in "https://nestarcadia.com/images/home-hero-mobile-v2.webp" "https://nestarcadia.com/images/home-hero-optimized-v2.webp"; do
            content_type=$(curl --location --silent --show-error --retry 3 --retry-delay 2 -o /dev/null -w '%{content_type}' "$url")
            echo "$url -> Content-Type $content_type"
            case "$content_type" in
              image/webp*) ;;
              *) echo "::error::Hero asset was not served as image/webp: $url ($content_type)"; exit 1 ;;
            esac
          done
