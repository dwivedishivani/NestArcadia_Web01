name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare optimized homepage hero image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
          mkdir -p public/images
          curl --fail --location --silent --show-error --retry 3 \
            'https://etmrhxapfvyaispuvnft.supabase.co/storage/v1/object/public/site-images/home/home-hero-carousel-hero-hero-carousel-photo-1-20261006220649229.webp' \
            --output "$RUNNER_TEMP/home-hero-source.webp"
          cwebp -quiet -mt -resize 1600 0 -q 78 \
            "$RUNNER_TEMP/home-hero-source.webp" \
            -o public/images/home-hero-optimized-v2.webp
          cwebp -quiet -mt -resize 1100 0 -q 72 \
            "$RUNNER_TEMP/home-hero-source.webp" \
            -o public/images/home-hero-mobile-v2.webp
          test -s public/images/home-hero-optimized-v2.webp
          test -s public/images/home-hero-mobile-v2.webp
          echo "Optimized desktop hero: $(du -h public/images/home-hero-optimized-v2.webp | cut -f1)"
          echo "Optimized mobile hero: $(du -h public/images/home-hero-mobile-v2.webp | cut -f1)"
      - name: Prepare self-hosted Latin fonts
        run: node scripts/prepare-local-fonts.mjs

      - name: Production build
        run: pnpm build

      - name: Verify Apache redirects and static route serving
        run: |
          test -f dist/.htaccess
          sudo apt-get update -qq
          sudo apt-get install -y apache2
          sudo a2enmod rewrite headers
          sudo rm -rf /var/www/nestarcadia
          sudo mkdir -p /var/www/nestarcadia
          sudo cp -a dist/. /var/www/nestarcadia/
          sudo chown -R www-data:www-data /var/www/nestarcadia
          sudo tee /etc/apache2/sites-available/000-default.conf > /dev/null <<EOF
          <VirtualHost *:80>
            DocumentRoot "/var/www/nestarcadia"
            <Directory "/var/www/nestarcadia">
              Options FollowSymLinks
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          EOF
          sudo apachectl configtest
          sudo service apache2 restart
          node scripts/apache-redirect-smoke.mjs

      - name: Start production preview for browser tests
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite-preview.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Production preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite-preview.log"
          exit 1

      - name: Install Playwright Chromium for production smoke tests
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright-smoke" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/playwright-smoke/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test mobile hero and lead conversion event flow
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/playwright-smoke/node_modules/playwright/index.mjs
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node scripts/production-smoke.mjs

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestarcadia-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
