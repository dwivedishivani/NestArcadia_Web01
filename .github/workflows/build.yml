name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare optimized homepage hero image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp imagemagick
          mkdir -p public/images
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            'https://etmrhxapfvyaispuvnft.supabase.co/storage/v1/object/public/site-images/home/home-hero-carousel-hero-hero-carousel-photo-1-20261006220649229.webp' \
            --output "$RUNNER_TEMP/home-hero-source.webp"
          cwebp -quiet -mt -resize 1600 0 -q 78 \
            "$RUNNER_TEMP/home-hero-source.webp" \
            -o public/images/home-hero-optimized-v2.webp
          cwebp -quiet -mt -resize 1100 0 -q 72 \
            "$RUNNER_TEMP/home-hero-source.webp" \
            -o public/images/home-hero-mobile-v2.webp
          test -s public/images/home-hero-optimized-v2.webp
          test -s public/images/home-hero-mobile-v2.webp
          echo "Optimized desktop hero: $(du -h public/images/home-hero-optimized-v2.webp | cut -f1)"
          echo "Optimized mobile hero: $(du -h public/images/home-hero-mobile-v2.webp | cut -f1)"
      - name: Prepare responsive site image variants
        run: node scripts/prepare-responsive-site-images.mjs

      - name: Prepare NestArcadia app icons
        run: node scripts/prepare-app-icons.mjs

      - name: Prepare self-hosted Latin fonts
        run: node scripts/prepare-local-fonts.mjs

      - name: Production build
        run: pnpm build
        env:
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}

      - name: Verify Apache redirects and static route serving
        run: |
          test -f dist/.htaccess
          sudo apt-get update -qq
          sudo apt-get install -y apache2
          sudo a2enmod rewrite headers
          sudo rm -rf /var/www/nestarcadia
          sudo mkdir -p /var/www/nestarcadia
          sudo cp -a dist/. /var/www/nestarcadia/
          sudo chown -R www-data:www-data /var/www/nestarcadia
          sudo tee /etc/apache2/sites-available/000-default.conf > /dev/null <<EOF
          <VirtualHost *:80>
            DocumentRoot "/var/www/nestarcadia"
            <Directory "/var/www/nestarcadia">
              Options FollowSymLinks
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          EOF
          sudo apachectl configtest
          sudo service apache2 restart
          node scripts/apache-redirect-smoke.mjs

      - name: Start production preview for browser tests
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite-preview.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Production preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite-preview.log"
          exit 1

      - name: Install Playwright Chromium for production smoke tests
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright-smoke" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/playwright-smoke/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run Lighthouse mobile and desktop audits
        run: |
          npm install --prefix "$RUNNER_TEMP/lighthouse-audit" --no-audit --no-fund lighthouse@12.8.2
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 -print -quit)"
          test -n "$CHROME_BIN"
          LIGHTHOUSE="$RUNNER_TEMP/lighthouse-audit/node_modules/.bin/lighthouse"
          "$LIGHTHOUSE" http://127.0.0.1:4173/ --chrome-path="$CHROME_BIN" --preset=desktop --only-categories=performance,accessibility,seo --output=json --output-path="$RUNNER_TEMP/lighthouse-desktop.json" --chrome-flags="--headless --no-sandbox"
          "$LIGHTHOUSE" http://127.0.0.1:4173/ --chrome-path="$CHROME_BIN" --form-factor=mobile --throttling-method=simulate --only-categories=performance,accessibility,seo --output=json --output-path="$RUNNER_TEMP/lighthouse-mobile.json" --chrome-flags="--headless --no-sandbox"
          node - "$RUNNER_TEMP/lighthouse-mobile.json" "$RUNNER_TEMP/lighthouse-desktop.json" <<'NODE'
          const fs = require('node:fs');
          for (const file of process.argv.slice(2)) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const score = (key) => Math.round((report.categories[key]?.score ?? 0) * 100);
            const metric = (key) => Math.round(report.audits[key]?.numericValue ?? 0);
            console.log('LIGHTHOUSE_SUMMARY', JSON.stringify({
              formFactor: report.configSettings.formFactor,
              performance: score('performance'),
              accessibility: score('accessibility'),
              seo: score('seo'),
              lcpMs: metric('largest-contentful-paint'),
              tbtMs: metric('total-blocking-time'),
              cls: report.audits['cumulative-layout-shift']?.numericValue ?? null,
              fcpMs: metric('first-contentful-paint'),
            }));
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestarcadia-lighthouse-reports
          path: |
            ${{ runner.temp }}/lighthouse-mobile.json
            ${{ runner.temp }}/lighthouse-desktop.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test mobile hero and lead conversion event flow
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/playwright-smoke/node_modules/playwright/index.mjs
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node scripts/production-smoke.mjs

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestarcadia-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
