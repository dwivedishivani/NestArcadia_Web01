name: One-off Live Lead E2E Verification

on:
  push:
    branches:
      - diagnose/live-lead-verification

permissions:
  contents: read

jobs:
  live-lead-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright-live-e2e" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/playwright-live-e2e/node_modules/.bin/playwright" install --with-deps chromium

      - name: Submit one temporary QA lead to production
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/playwright-live-e2e/node_modules/playwright/index.mjs
          SMOKE_BASE_URL: https://nestarcadia.com
        run: node scripts/live-lead-e2e.mjs
