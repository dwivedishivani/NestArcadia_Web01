name: Notify IndexNow

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify search engines
        run: |
          curl --fail --silent --show-error -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "nestarcadia.com",
              "key": "9f4d7c2a61be58d0f3e1a6c84b9275d1",
              "keyLocation": "https://nestarcadia.com/indexnow-key.txt",
              "urlList": [
                "https://nestarcadia.com/",
                "https://nestarcadia.com/design-cultures/",
                "https://nestarcadia.com/interior-design-services/",
                "https://nestarcadia.com/our-story/",
                "https://nestarcadia.com/our-projects/",
                "https://nestarcadia.com/journal/",
                "https://nestarcadia.com/faqs/",
                "https://nestarcadia.com/start-your-project/",
                "https://nestarcadia.com/interior-design-greater-noida-west/",
                "https://nestarcadia.com/interior-design-noida-extension/",
                "https://nestarcadia.com/commercial-interior-design-greater-noida-west/"
              ]
            }'