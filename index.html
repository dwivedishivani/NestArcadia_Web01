  <style>
    #app-bootloader[hidden] { display: none !important; }
    #app-bootloader {
      position: fixed; inset: 0; z-index: 9999; display: flex;
      height: 100vh; min-height: 640px; overflow: hidden;
      align-items: flex-end; background: #1C3A5A; color: #fff;
    }
    #app-bootloader .boot-picture { position: absolute; inset: 0; display: block; }
    #app-bootloader .boot-image { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; }
    #app-bootloader .boot-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.40) 60%, rgba(0,0,0,.10)); }
    #app-bootloader .boot-wordmark { position: absolute; z-index: 2; top: 20px; left: 24px; color: #fff; font: 600 22px/1 Georgia, serif; letter-spacing: .01em; }
    #app-bootloader .boot-content { position: relative; z-index: 2; width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 24px 112px; }
    #app-bootloader .boot-eyebrow { margin: 0 0 20px; color: rgba(255,255,255,.8); font: 500 10px/1.5 Arial, sans-serif; letter-spacing: .32em; text-transform: uppercase; }
    #app-bootloader h1 { margin: 0 0 28px; max-width: 800px; color: #fff; font: 500 clamp(2.5rem, 7vw, 5.25rem)/1.04 Georgia, 'Times New Roman', serif; letter-spacing: -.02em; }
    #app-bootloader .boot-description { max-width: 300px; margin: 0 0 36px; color: rgba(255,255,255,.68); font: 400 15px/1.65 Arial, sans-serif; }
    #app-bootloader .boot-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
    #app-bootloader .boot-primary { display: inline-block; border: 1px solid rgba(255,255,255,.5); padding: 12px 28px; color: #fff; font: 400 14px/1.5 Arial, sans-serif; text-decoration: none; }
    #app-bootloader .boot-secondary { display: inline-flex; align-items: center; gap: 10px; color: rgba(255,255,255,.78); font: 400 14px/1.5 Arial, sans-serif; text-decoration: none; }
    #app-bootloader .boot-play { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.6); border-radius: 50%; color: #fff; font-size: 12px; }
    #app-bootloader .boot-counter { position: absolute; z-index: 2; bottom: 80px; left: 24px; display: flex; align-items: center; gap: 12px; color: #fff; font: 400 12px/1.5 Arial, sans-serif; letter-spacing: .14em; }
    #app-bootloader .boot-rule { width: 48px; height: 1px; background: rgba(255,255,255,.25); }
    @media (min-width: 640px) {
      #app-bootloader .boot-content { padding-bottom: 32px; }
      #app-bootloader .boot-counter { bottom: 32px; }
    }
    @media (min-width: 1024px) {
      #app-bootloader .boot-content { padding-left: 80px; padding-right: 80px; }
      #app-bootloader .boot-counter { left: 80px; }
    }

    <script>
      (function () {
        var boot = document.getElementById('app-bootloader');
        if (!boot) return;
        if (window.location.pathname !== '/' && window.location.pathname !== '') {
          boot.remove();
          return;
        }
        boot.hidden = false;
        var image = boot.querySelector('img[data-boot-src]');
        if (image) image.src = image.getAttribute('data-boot-src');
      })();
